        <style>
            :root{
              --ground:#050F17; --surface:#0A2435; --surface-2:#0E2C3F;
              --ink:#E8E7DF; --ink-2:#B9C2C9; --ink-3:#7D8A94;
              /* fed by --template-color-primary / --template-color-secondary on the CLI */
              --accent: #E4B363;
              --wash: #10334A;
              --line:rgba(215,214,204,.16);
            }
            *{box-sizing:border-box}
            .staticrypt-body{
              margin:0; min-height:100vh; background:var(--ground); color:var(--ink);
              font-family:"Radio Canada",system-ui,-apple-system,sans-serif;
              /* a soft midnight wash so the flat ground doesn't read as an error page */
              background-image:radial-gradient(1200px 620px at 50% -12%, var(--wash) 0%, var(--ground) 62%);
            }
            .staticrypt-page{
              min-height:100vh; display:flex; align-items:center; justify-content:center;
              padding:28px 20px;
            }
            .staticrypt-form{
              width:100%; max-width:372px; padding:34px 32px 30px; text-align:center;
              background:var(--surface); border:1px solid var(--line); border-radius:14px;
              box-shadow:0 30px 70px -30px rgba(0,0,0,.85);
            }
            .staticrypt-logo{width:132px; height:auto; display:block; margin:0 auto 26px}
            .staticrypt-instructions{margin:0 0 22px}
            .staticrypt-title{
              margin:0 0 8px; font-family:"Rethink Sans",sans-serif; font-weight:700;
              font-size:19px; letter-spacing:.01em; color:var(--ink);
            }
            .staticrypt-instructions p:not(.staticrypt-title){
              margin:0; font-size:13.5px; line-height:1.5; color:var(--ink-3);
            }
            .staticrypt-hr{border:0; border-top:1px solid var(--line); margin:0 0 22px}

            .staticrypt-password-container{position:relative; margin-bottom:14px}
            #staticrypt-password{
              width:100%; padding:13px 44px 13px 15px; border-radius:9px;
              background:var(--surface-2); border:1px solid var(--line); color:var(--ink);
              font-family:inherit; font-size:14.5px; outline:none;
              transition:border-color .15s, box-shadow .15s;
            }
            #staticrypt-password::placeholder{color:var(--ink-3)}
            #staticrypt-password:focus{
              border-color:rgba(228,179,99,.55); box-shadow:0 0 0 3px rgba(228,179,99,.12);
            }
            .staticrypt-toggle-password-visibility{
              position:absolute; right:13px; top:50%; transform:translateY(-50%);
              width:19px; cursor:pointer; opacity:.5; transition:opacity .15s;
              /* the stock icon is a black SVG, invisible on a dark field - invert it */
              filter:invert(1);
            }
            .staticrypt-toggle-password-visibility:hover{opacity:.85}

            .staticrypt-decrypt-button{
              width:100%; padding:13px 16px; border:0; border-radius:9px; cursor:pointer;
              background:var(--accent); color:#0A2435;
              font-family:"Rethink Sans",sans-serif; font-weight:700; font-size:13px;
              letter-spacing:.09em; text-transform:uppercase;
              transition:filter .15s, transform .06s;
            }
            .staticrypt-decrypt-button:hover{filter:brightness(1.08)}
            .staticrypt-decrypt-button:active{transform:translateY(1px)}

            .staticrypt-remember{
              display:flex; align-items:center; gap:8px; justify-content:center;
              margin:0 0 14px; font-size:12.5px; color:var(--ink-3); cursor:pointer;
            }
            .staticrypt-remember input{accent-color:var(--accent)}

            .hidden{display:none !important}
            .staticrypt-spinner-container{
              min-height:100vh; display:flex; align-items:center; justify-content:center;
            }
            .staticrypt-spinner{
              width:34px; height:34px; border-radius:50%;
              border:3px solid var(--line); border-top-color:var(--accent);
              animation:staticrypt-spin .8s linear infinite;
            }
            @keyframes staticrypt-spin{to{transform:rotate(360deg)}}
        </style>
    </head>
